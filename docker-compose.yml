services:
  rackwire:
    image: ghcr.io/spakarl/rackwire:latest
    build: .
    container_name: rackwire
    ports:
      - "${RACKWIRE_PORT:-3040}:3040"
    volumes:
      # Same tree as `make run` (DATA_PATH=data/rack.json, templates, colors)
      - ./data:/app/data
    restart: unless-stopped
